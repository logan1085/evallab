services:
  grading-room:
    build: .
    image: grading-room:latest
    ports:
      - "8787:8787"
    volumes:
      - grading-room-data:/data
    environment:
      # Without a key the judge falls back to an offline stub that is labelled,
      # everywhere it appears, as not a real judge.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GR_JUDGE_MODEL: ${GR_JUDGE_MODEL:-claude-opus-5}
    # PID 1 that reaps children and forwards SIGTERM, so the graceful shutdown
    # in server/index.ts actually runs on `docker compose down`.
    init: true
    restart: unless-stopped

volumes:
  grading-room-data:
