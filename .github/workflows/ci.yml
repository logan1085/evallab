name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  serverless:
    name: serverless entry boots and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # The unit suite drives the Express app directly, which never exercises
      # api/index.ts — the file Vercel actually invokes. A broken import or a
      # pool built per request would pass every test and fail on deploy, so this
      # runs the real handler over real HTTP.
      - name: Boot the handler
        run: |
          set -euo pipefail
          cat > ci-entry-check.ts <<'TS'
          import { createServer } from 'node:http';
          import handler from './api/index.js';

          const server = createServer((req, res) => handler(req, res));
          await new Promise<void>((r) => server.listen(4189, '127.0.0.1', r));
          const base = 'http://127.0.0.1:4189';

          const health = await fetch(`${base}/api/health`).then((r) => r.json());
          if (!health.ok) throw new Error(`health failed: ${JSON.stringify(health)}`);

          const made = await fetch(`${base}/api/projects`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ name: 'CI' }),
          });
          if (made.status !== 201) throw new Error(`create failed: ${made.status}`);
          const { project } = await made.json();

          const view = await fetch(`${base}/api/projects/${project.slug}`, {
            headers: { 'x-gr-token': project.token },
          }).then((r) => r.json());
          if (view.rubric.version !== 1) throw new Error('project view came back wrong');

          // A warm invocation must reuse the instance, not rebuild the pool.
          const warm = await fetch(`${base}/api/health`).then((r) => r.json());
          if (!warm.ok) throw new Error('warm request failed');

          console.log('serverless entry serves:', project.slug);
          server.close();
          process.exit(0);
          TS
          npx tsx ci-entry-check.ts
          rm ci-entry-check.ts

      # The SPA is served by Vercel as static files, so the build has to produce
      # an index.html that references the hashed bundle.
      - name: Build the SPA
        run: |
          set -euo pipefail
          npm run build:web
          test -f dist/web/index.html
          grep -q 'assets/index-' dist/web/index.html
          echo "spa built"
